name: Fetch DLD Transactions

on:
  # Railway runs the DLD scans (10:30 UTC afternoon, plus evening). This is the
  # backup: it runs 45 minutes after Railway's, so a Railway outage (as on
  # 21-22 October 2026) delays sales data by under an hour instead of days.
  # The import skips rows already stored, so a second run after a good one
  # changes nothing. Also runnable by hand for a recovery scan.
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch all DLD transactions & sync to Supabase
        run: npm run fetch:dld
        env:
          SHEET_URL: ${{ vars.SHEET_URL }}
          DLD_LIVE_DAYS: ${{ vars.DLD_LIVE_DAYS }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
