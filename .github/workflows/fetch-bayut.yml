name: Fetch DLD Transactions

on:
  schedule:
    # 14:30 and 18:00 Dubai time. The afternoon fetch lands ~1h later
    # (~15:30-16:00 Dubai), in time for same-day auto-sends before the
    # 18:00 send-window close; the evening sweep catches the rest, which
    # the auto-sender's one-day lookback delivers the next morning.
    - cron: "30 10 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch all DLD transactions & sync to Supabase
        run: npm run fetch:dld
        env:
          SHEET_URL: ${{ vars.SHEET_URL }}
          DLD_LIVE_DAYS: ${{ vars.DLD_LIVE_DAYS }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
