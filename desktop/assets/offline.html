<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src file:; navigate-to https://sellersignal.vercel.app"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repeat AI is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080808;
        color: #f4f1eb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(420px, calc(100vw - 48px));
        text-align: center;
      }

      .mark {
        width: fit-content;
        margin: 0 auto 22px;
        padding: 10px 14px;
        border: 1px solid #35332f;
        border-radius: 12px;
        color: #f4f1eb;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 26px;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 24px;
        color: #a8a39a;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 10px;
        background: #f4f1eb;
        color: #080808;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">REPEAT AI</div>
      <h1>Repeat AI couldn’t connect</h1>
      <p>Check your internet connection, then try loading the app again.</p>
      <a href="https://sellersignal.vercel.app">Try again</a>
    </main>
  </body>
</html>
