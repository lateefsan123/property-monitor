<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repeat AI sellers</title>
<style>
:root{font-family:var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,#202020);background:var(--color-background-primary,#fff);color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1100px;margin-inline:auto}header{display:flex;gap:12px;align-items:center;margin-bottom:24px}header img{width:38px;height:38px;border-radius:10px}h1{font-size:21px;margin:0}h2{font-size:18px;margin:0 0 16px}h3{font-size:14px;margin-top:24px}p{line-height:1.5}.muted,dt,small{color:var(--color-text-secondary,#717171)}header p{margin:3px 0 0;font-size:13px}form{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;color:inherit;border:1px solid var(--color-border-primary,#ddd);border-radius:10px;padding:10px 12px;background:var(--color-background-primary,#fff)}input{flex:1;min-width:160px}button{cursor:pointer}button:hover{background:var(--color-background-secondary,#f6f6f6)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #657e62;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}#search-button,#summarise{background:#243d2d;color:#fff;border-color:#243d2d}.layout{display:grid;grid-template-columns:minmax(230px,1fr) minmax(260px,1.2fr);gap:24px;margin-top:16px}.seller{display:block;text-align:left;width:100%;margin:0 0 8px;padding:15px}.seller span{display:block;font-size:12px;margin-top:5px}.seller[aria-pressed=true]{border-color:#657e62;background:var(--color-background-secondary,#f5f7f4)}#count,#status{font-size:12px}#status:empty{display:none}#detail{border-left:1px solid var(--color-border-primary,#eee);padding-left:24px}dl{margin:0}dt{font-size:12px;margin:14px 0 3px}dd{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.message{padding:12px 0;border-bottom:1px solid var(--color-border-primary,#eee)}.message p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message small{font-size:11px}#actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}#actions[hidden],#detail[hidden]{display:none}.empty{padding:24px 0}@media(max-width:600px){body{padding:16px}.layout{grid-template-columns:1fr}#detail{border-left:0;border-top:1px solid var(--color-border-primary,#eee);padding:20px 0}#leads{max-height:280px;overflow:auto}}:root[data-repeat-theme="dark"]{--color-text-primary:#eee;--color-text-secondary:#aaa;--color-background-primary:#212121;--color-background-secondary:#2b2b2b;--color-border-primary:#444}
</style></head><body>
<header><img src="__LOGO__" alt=""><div><h1>Repeat AI</h1><p>Your seller workspace</p></div></header>
<form id="search-form"><input id="search" type="search" aria-label="Search sellers" placeholder="Search name, building or phone"><select id="filter" aria-label="Seller filter"><option value="all">All sellers</option><option value="active">Unsent</option><option value="done">Sent</option></select><button id="search-button" disabled>Search</button></form>
<p id="status" role="status" aria-live="polite">Connecting to Repeat AI…</p>
<div class="layout"><section aria-label="Sellers"><p id="count"></p><div id="leads"></div></section><section id="detail" aria-label="Seller details" hidden><h2 id="detail-title"></h2><dl id="fields"></dl><div id="actions" hidden><button id="summarise">Summarise replies</button><button id="monitor">Monitor replies</button></div><h3>Recent messages</h3><div id="messages"></div></section></div>
<script type="module">__SCRIPT__</script></body></html>
