<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repeat AI · Walking rig</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:#263d2f;font-family:system-ui,sans-serif;display:grid;justify-items:center;padding:22px}h1{font-size:17px;font-weight:500}canvas{width:min(100%,800px);height:auto;background:#fff;border-radius:16px}nav{display:flex;gap:12px;margin:18px}button{font:inherit;font-size:14px;padding:10px 18px;background:white;border:1px solid #ccd5c9;border-radius:8px;cursor:pointer}p{font-size:13px;color:#687361;max-width:700px;line-height:1.6}</style></head><body><h1>Repeat AI · Walking test</h1><canvas width="1000" height="800" aria-label="Broker walking with jointed legs and swinging arms"></canvas><nav><button id="pause">Pause animation</button><button id="travel">Walk in place</button></nav><p>The approved character's head with a new jointed body: bending knees, planted feet, arm swing and a gentle body bob. A movement prototype.</p><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),face=new Image();face.src='approved-broker.png';
const TAU=Math.PI*2,PERIOD=.9,DURATION=8,GROUND=670,TRAVEL=1320/DURATION,STRIDE=TRAVEL*.6*PERIOD;
let ready=false,playing=true,inPlace=false,start=performance.now(),held=0;
const ink='#0b100d',shirt='#183f30',backShirt='#123325',cream='#f0e8d4',backCream='#dcd4c0',skin='#c9813e';
function line(points,width,colour){g.beginPath();g.moveTo(...points[0]);for(const p of points.slice(1))g.lineTo(...p);g.lineCap='round';g.lineJoin='round';g.strokeStyle=ink;g.lineWidth=width+7;g.stroke();g.strokeStyle=colour;g.lineWidth=width;g.stroke();}
function circle(x,y,r,colour,outline=4){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=colour;g.fill();if(outline){g.strokeStyle=ink;g.lineWidth=outline;g.stroke();}}
function foot(p){p=((p%1)+1)%1;if(p<.6)return {x:STRIDE/2-STRIDE*p/.6,lift:0,angle:0,stance:true};const u=(p-.6)/.4;return {x:-STRIDE/2+STRIDE*(u*u*(3-2*u)),lift:29*Math.sin(Math.PI*u),angle:-.16*Math.sin(Math.PI*u),stance:false};}
function knee(hx,hy,fx,fy){const dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy),L=101; if(d>2*L)throw Error('Unreachable foot target');const bend=Math.sqrt(Math.max(0,L*L-d*d/4));return {x:(hx+fx)/2+bend*dy/d,y:(hy+fy)/2-bend*dx/d};}
function leg(hx,hy,ph,hipY,back){const f=foot(ph),fx=hx+f.x,fy=GROUND-hipY-f.lift;const k=knee(hx,hy,fx,fy);line([[hx,hy],[k.x,k.y],[fx,fy-7]],27,back?backCream:cream);
g.save();g.translate(fx,fy-4);g.rotate(f.angle);g.fillStyle=ink;g.beginPath();g.moveTo(-18,-10);g.quadraticCurveTo(-21,9,-12,11);g.lineTo(28,11);g.quadraticCurveTo(34,4,24,-2);g.lineTo(7,-11);g.closePath();g.fill();g.restore();return {footX:fx,footY:fy,stance:f.stance,kneeX:k.x,kneeY:k.y};}
function arm(back,phase){const sx=back?-33:38,sy=-101;const a=Math.sin(phase)*.52*(back?1:-1)+(back?.16:-.13);const elbow={x:sx+Math.sin(a)*53,y:sy+Math.cos(a)*53};const b=a+(back?-.16:-.47);const wrist={x:elbow.x+Math.sin(b)*48,y:elbow.y+Math.cos(b)*48};line([[sx,sy],[elbow.x,elbow.y],[wrist.x,wrist.y]],22,back?backShirt:shirt);circle(wrist.x,wrist.y+6,11,skin,4);}
function head(phase){g.save();g.translate(0,-129);g.rotate(Math.sin(phase)*.018);g.scale(.405,.405);g.translate(-575,-408);g.beginPath();const points=[[405,31],[720,31],[728,360],[691,409],[615,431],[553,416],[483,391],[418,343],[398,246]];g.moveTo(...points[0]);for(const p of points.slice(1))g.lineTo(...p);g.closePath();g.clip();g.drawImage(face,0,0);g.restore();}
function draw(time){if(!ready)return;const t=((time%DURATION)+DURATION)%DURATION,phase=TAU*t/PERIOD;const x=inPlace?500:-160+TRAVEL*t;const hipY=GROUND-192-3*Math.cos(phase*2);
g.setTransform(1,0,0,1,0,0);g.fillStyle='#fff';g.fillRect(0,0,1000,800);g.strokeStyle='#e4e9df';g.lineWidth=2;g.beginPath();g.moveTo(45,GROUND+13);g.lineTo(955,GROUND+13);g.stroke();g.fillStyle='#e9eee4';g.beginPath();g.ellipse(x+5,GROUND+14,68,9,0,0,TAU);g.fill();
g.save();g.translate(x,hipY);const back=leg(-13,0,t/PERIOD+.5,hipY,true);arm(true,phase);
// Hip and torso overlap the limb ends, so joints remain covered.
g.fillStyle=cream;g.strokeStyle=ink;g.lineWidth=6;g.beginPath();g.roundRect(-37,-20,74,40,13);g.fill();g.stroke();
const front=leg(13,0,t/PERIOD,hipY,false);
g.save();g.rotate(.035);g.strokeStyle=ink;g.lineWidth=6;g.fillStyle=shirt;g.beginPath();g.moveTo(-25,-132);g.quadraticCurveTo(-44,-123,-44,-98);g.lineTo(-39,-10);g.quadraticCurveTo(0,0,41,-9);g.lineTo(44,-95);g.quadraticCurveTo(43,-124,25,-132);g.closePath();g.fill();g.stroke();
// Small neck and collar, then the actual approved head artwork.
g.fillStyle=skin;g.beginPath();g.roundRect(-17,-147,34,28,7);g.fill();g.stroke();head(phase);g.fillStyle=shirt;g.strokeStyle=ink;g.lineWidth=4;g.beginPath();g.moveTo(-25,-130);g.lineTo(-4,-115);g.lineTo(-12,-101);g.lineTo(-31,-119);g.closePath();g.fill();g.stroke();g.beginPath();g.moveTo(19,-130);g.lineTo(-4,-115);g.lineTo(8,-104);g.lineTo(29,-121);g.closePath();g.fill();g.stroke();g.restore();arm(false,phase);g.restore();
window.walkState={time:t,x,hipY,inPlace,back,front};}
window.seekWalk=t=>draw(t);window.walkReady=false;face.onload=()=>{ready=true;window.walkReady=true;draw(0);};
function tick(now){if(playing)draw((now-start)/1000);requestAnimationFrame(tick);}requestAnimationFrame(tick);
document.querySelector('#pause').onclick=()=>{playing=!playing;if(!playing)held=window.walkState.time;else start=performance.now()-held*1000;document.querySelector('#pause').textContent=playing?'Pause animation':'Play animation';};
document.querySelector('#travel').onclick=()=>{inPlace=!inPlace;document.querySelector('#travel').textContent=inPlace?'Walk across frame':'Walk in place';if(!playing)draw(held);};
</script></body></html>
