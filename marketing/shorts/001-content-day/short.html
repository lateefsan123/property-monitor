<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Short 001 — Content Day</title>
<style>
  @font-face { font-family: "Outfit"; font-weight: 900; src: url("../../../mobile/assets/fonts/Outfit-Black.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../../mobile/assets/fonts/Inter-Regular.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("../../../mobile/assets/fonts/Inter-SemiBold.ttf"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0C0D; }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  #pCorner, #pElena { position: absolute; left: 0; top: 0; transform-origin: 0 0; z-index: 26; display: none; }
  #chip { position: absolute; left: 60px; top: 418px; z-index: 50; padding: 10px 26px; border-radius: 30px; background: #141414; color: #fff;
          font: 600 30px "Inter", sans-serif; letter-spacing: .3px; white-space: nowrap; opacity: 0; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* Set: one kitchen, framed differently per shot */
  #room { background: #EDE4D3; }
  #set { width: 1080px; height: 1920px; }
  .pose { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .shadow { position: absolute; border-radius: 50%; background: rgba(40, 28, 10, .16); filter: blur(6px); }

  /* Ring light switch-on: a multiply wash greys the ring until it turns on */
  #ringOff { position: absolute; border-radius: 50%; mix-blend-mode: multiply; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none;
          background: radial-gradient(circle, rgba(255, 236, 196, .75) 0%, rgba(255, 228, 180, .32) 38%, rgba(255, 228, 180, 0) 70%); }

  /* Phone */
  #phone { width: 1000px; border-radius: 118px; background: #1C1D20; padding: 14px;
           box-shadow: 0 0 0 3px #2E3034, 0 40px 120px rgba(0,0,0,.55); }
  #screen { position: relative; width: 972px; height: 2187px; border-radius: 104px; overflow: hidden; background: #0E0E0F; }
  #statusbar { position: absolute; left: 0; top: 0; width: 972px; height: 80px; background: #0E0E0F; z-index: 5;
               font: 600 34px "Inter", sans-serif; color: #fff; }
  #statusbar .time { position: absolute; left: 92px; top: 26px; }
  #statusbar .island { position: absolute; left: 376px; top: 18px; width: 220px; height: 54px; border-radius: 30px; background: #000; }
  #statusbar .icons { position: absolute; right: 80px; top: 30px; display: flex; gap: 12px; align-items: flex-end; }
  #statusbar .bars i { display: inline-block; width: 7px; margin-right: 3px; background: #fff; border-radius: 2px; }
  #statusbar .batt { width: 52px; height: 24px; border: 3px solid rgba(255,255,255,.8); border-radius: 7px; padding: 2px; }
  #statusbar .batt b { display: block; height: 100%; width: 78%; background: #fff; border-radius: 3px; }
  .app { position: absolute; left: 0; top: 80px; width: 1179px; height: 2556px; transform-origin: 0 0; }
  .app img { position: absolute; left: 0; top: 0; width: 1179px; height: 2556px; }
  .hl { position: absolute; border: 6px solid #3FD3C0; border-radius: 26px;
        box-shadow: 0 0 0 6px rgba(63, 211, 192, .18), 0 0 40px rgba(63, 211, 192, .35); }
  .crop { position: absolute; background-repeat: no-repeat; background-size: 1179px 2556px; }
  #tapDim { position: absolute; border-radius: 30px; background: rgba(255,255,255,.14); }

  /* Captions: white with a heavy ink outline, like the drawings */
  #caption { position: absolute; left: 60px; right: 60px; top: 150px; height: 250px; display: flex;
             align-items: center; justify-content: center; text-align: center; z-index: 50; }
  #caption span { font: 900 74px/1.08 "Outfit", sans-serif; color: #fff; letter-spacing: -0.5px;
                  -webkit-text-stroke: 14px #141414; paint-order: stroke fill; text-wrap: balance; }
  #caption em { font-style: normal; color: #6FF0DD; }
  #label { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; z-index: 50; width: max-content; margin: 0 auto; padding: 8px 20px; border-radius: 22px; background: rgba(11,12,13,.78);
           font: 600 24px "Inter", sans-serif; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,.5); }

  /* End card */
  #endcard { background: transparent; }
  #topband { position: absolute; left: 0; right: 0; top: 0; height: 470px; z-index: 30; pointer-events: none;
             background: linear-gradient(to bottom, #0B0C0D 0%, rgba(11,12,13,.92) 62%, rgba(11,12,13,0) 100%); }
  #wordmark { position: absolute; left: 50%; top: 170px; width: 520px; transform: translateX(-50%); }
  #endline { position: absolute; left: 60px; right: 60px; top: 300px; text-align: center;
             font: 900 84px/1.04 "Outfit", sans-serif; color: #fff; letter-spacing: -1px; }
  #endline span { color: #6FF0DD; }
  #cta { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); white-space: nowrap; z-index: 60;
         padding: 26px 44px; border-radius: 60px; background: #fff; color: #0B0C0D; font: 600 40px "Inter", sans-serif; }
  #cta b { font-weight: 600; color: #11806F; }
  #endtop { position: absolute; left: 0; right: 0; top: 0; height: 700px; z-index: 0;
            background: linear-gradient(to bottom, #0B0C0D 0%, #0B0C0D 72%, rgba(11,12,13,0) 100%); }
  #wordmark, #endline { z-index: 2; }
  #endfade { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; z-index: 55;
             background: linear-gradient(to bottom, rgba(11,12,13,0), #0B0C0D 62%); }
</style>
</head>
<body>

<!-- ───────── Kitchen set + poses ───────── -->
<div class="layer" id="room">
  <div class="abs" id="set">
    <svg width="1080" height="1920" viewBox="0 0 1080 1920" stroke="#141414" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <!-- window with a skyline -->

      <!-- splashback tiles -->
      <g stroke="#D7CCB8" stroke-width="3">
        <line x1="0" y1="820" x2="390" y2="820"/><line x1="0" y1="900" x2="390" y2="900"/><line x1="0" y1="980" x2="390" y2="980"/><line x1="0" y1="1060" x2="390" y2="1060"/>
      </g>
      <!-- lower cabinets + counter -->
      <rect x="-10" y="1130" width="420" height="44" fill="#2A2A2A"/>

      <line x1="220" y1="1240" x2="220" y2="1290" stroke-width="8"/>
      <!-- kettle and plant on the counter -->

      <path d="M308,1066 C290,1020 262,1010 252,990 C282,994 300,1020 308,1050 C312,1012 330,990 356,984 C350,1016 326,1040 310,1066 Z" fill="#5E8C61" stroke-width="5"/>
      <!-- floor -->
      <rect x="-10" y="1504" width="1100" height="430" fill="#D3BE99"/>

      <g stroke="#BFA77F" stroke-width="3"><line x1="0" y1="1640" x2="1080" y2="1640"/><line x1="0" y1="1800" x2="1080" y2="1800"/></g>
    </svg>
  </div>

  <div class="glow" id="glow"></div>
  <div class="shadow" id="shadow"></div>
  <img class="pose" id="pHook" src="pose-hook.png">
  <div id="ringOff"></div>
  <img class="pose" id="pInt" src="pose-interrupted.png">
  <svg class="pose" id="buzz" width="1355" height="1161" viewBox="0 0 1355 1161" fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round">
    <path d="M948,452 L968,420"/><path d="M966,480 L1004,462"/><path d="M760,452 L738,424"/>
  </svg>
  <img class="pose" id="pSetup" src="pose-setup.png">
  <img class="pose" id="pPay" src="pose-payoff.png">

  <svg class="abs" id="iris" width="1080" height="1920" style="pointer-events:none"><circle id="irisRing" fill="none" stroke="#FFF6E6" stroke-width="40"/></svg>
</div>

<!-- ───────── Demo cards: live crops of the real app, and the seller's side ───────── -->
<img id="pCorner" src="pose-setup.png">
<img id="pElena" src="pose-elena-cafe.png">

<!-- ───────── App ───────── -->
<div class="layer" id="appLayer">
  <div class="abs" id="appStage"></div>
  <div id="topband"></div>
  <div id="label" style="display:none"></div>
</div>

<!-- ───────── End card ───────── -->
<div class="layer" id="endcard">
  <img id="wordmark" src="../../../mobile/assets/repeat-ai-logo.png">
  <div id="endline">Set up your follow-ups once.<br><span>Get back to work.</span></div>
  <div id="endtop"></div>
  <div id="endfade"></div>

</div>

<div id="caption"><span id="capText"></span></div>

<script src="../lib/app-phone.js"></script>
<script src="../lib/drawn-screens.js"></script>
<script>
// Timeline; build-short.mjs replaces this with times measured from the chosen narration takes.
window.TL = window.TL || {
  end: 24.0,
  lines: [], captions: [],
  cue: {
    lightOn: 0.35, buzz: 2.05, cutInt: 2.2, zoom: 4.75, tap: 6.35, toTpl: 7.05, toUse: 8.75,
    toAuto: 9.85, toggle: 10.6, toWa: 11.75, backAuto: 13.05, stop: 13.4, toPay: 15.75, endCard: 19.2,
  },
};

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const out = u => 1 - Math.pow(1 - u, 3);
const prog = (t, a, d) => clamp((t - a) / d);
const set = (el, css) => Object.assign(el.style, css);

// ── Shot framings (canvas px). Each pose is placed by scale + offset of its source image.
const POSE = {
  hook: { s: 1.26, x: 560 - 715 * 1.26, y: 1660 - 1076 * 1.26 },
  int:  { s: 1.45, x: 540 - 650 * 1.45, y: 1920 - 1161 * 1.45 },
  pay:  { s: 1.22, x: 520 - 708 * 1.22, y: 1660 - 1099 * 1.22 },
};
const at = (p, sx, sy) => [p.x + sx * p.s, p.y + sy * p.s];

const mixCam = (a, b, u) => ({ sx: lerp(a.sx, b.sx, u), sy: lerp(a.sy, b.sy, u), z: lerp(a.z, b.z, u), cx: lerp(a.cx ?? 540, b.cx ?? 540, u), cy: lerp(a.cy ?? 1180, b.cy ?? 1180, u), rot: lerp(a.rot ?? 0, b.rot ?? 0, u) });
let PH = null;

function render(t) {
  const C = TL.cue;

  // ── Which layer is visible
  const inApp = t >= C.zoom && t < C.toPay + 0.55;
  const inEnd = t >= C.endCard;

  // ── Room shots
  let roomOn = true;
  const hookOn = t < C.cutInt, intOn = t >= C.cutInt && t < C.toPay, payOn = t >= C.toPay;
  set($("pHook"), { display: hookOn ? "block" : "none" });
  set($("ringOff"), { display: hookOn ? "block" : "none" });
  set($("pInt"), { display: intOn ? "block" : "none" });
  set($("buzz"), { display: intOn ? "block" : "none" });
  set($("pPay"), { display: payOn ? "block" : "none" });
  set($("pSetup"), { display: "none" });
  set($("recGlow"), { display: payOn ? "block" : "none" });

  let camS = 1, camX = 0, camY = 0;   // room camera (scale about origin)
  const breathe = 1 + 0.004 * Math.sin(t * 2.2);

  if (hookOn) {
    const P = POSE.hook;
    const push = lerp(1, 1.05, ease(prog(t, 0, C.cutInt)));
    camS = push; camX = 540 * (1 - push); camY = 1100 * (1 - push);
    set($("pHook"), { transform: `translate(${P.x}px, ${P.y + 1076 * P.s * (1 - breathe)}px) scale(${P.s}, ${P.s * breathe})` });
    const [rx, ry] = at(P, 873, 374);
    const on = out(prog(t, C.lightOn, 0.12));
    set($("ringOff"), { left: `${rx - 140 * P.s}px`, top: `${ry - 140 * P.s}px`, width: `${280 * P.s}px`, height: `${280 * P.s}px`,
                         background: `radial-gradient(circle, rgba(255,255,255,1) 0 ${92 * P.s}px, rgba(150,146,138,${1 - on}) ${93 * P.s}px ${138 * P.s}px, rgba(255,255,255,1) ${139 * P.s}px)` });
    set($("glow"), { display: "block", opacity: on * (0.9 + 0.1 * Math.sin(t * 9)), left: `${rx - 420}px`, top: `${ry - 420}px`, width: "840px", height: "840px" });
    const [fx, fy] = at(P, 715, 1072);
    set($("shadow"), { left: `${fx - 360}px`, top: `${fy - 26}px`, width: "720px", height: "52px" });
  } else if (intOn && t >= C.cardsIn) {
    // the demo: he sets it up on his phone while the real app sits beside him as cards
    set($("pInt"), { display: "none" }); set($("buzz"), { display: "none" });
    const s = 820 / 1088, x = 470 - 695.5 * s, y = 1885 - 1112 * s;
    const push = lerp(1, 1.03, prog(t, C.toTpl, 8));
    camS = push; camX = 540 * (1 - push); camY = 1500 * (1 - push);
    // the phone is the subject now; he stands small in the corner in front of it (#pCorner)
    set($("glow"), { display: "none" });
    set($("shadow"), { display: "block", left: "305px", top: "1860px", width: "330px", height: "42px" });
  } else if (intOn) {
    const P = POSE.int;
    // closer framing of the same set, slow push; zoom into his phone for the cut to the app
    const push = lerp(1, 1.04, prog(t, C.cutInt, 3));
    const [px, py] = at(P, 855, 564);
    const z = ease(prog(t, C.zoom, 0.55));
    const s = push * lerp(1, 7, z);
    camS = s; camX = px * (1 - s); camY = py * (1 - s);
    // the phone buzz: tiny shake + vibration marks
    const bz = prog(t, C.cutInt - 0.05, 0.75);
    const shake = bz > 0 && bz < 1 ? Math.sin(t * 120) * 5 * (1 - bz) : 0;
    set($("pInt"), { transform: `translate(${P.x + shake}px, ${P.y + 1161 * P.s * (1 - breathe)}px) scale(${P.s}, ${P.s * breathe})` });
    set($("buzz"), { transform: `translate(${P.x + shake}px, ${P.y}px) scale(${P.s})`, opacity: bz > 0 && bz < 1 ? (Math.sin(t * 40) > -0.3 ? 1 : 0.2) : 0 });
    set($("glow"), { display: "block", opacity: 0.55, left: `${at(P, 1300, 470)[0] - 420}px`, top: `${at(P, 1300, 470)[1] - 420}px`, width: "840px", height: "840px" });
    set($("shadow"), { display: "none" });
  } else {
    const P = POSE.pay;
    const push = lerp(1.03, 1, out(prog(t, C.toPay, 3.2)));
    camS = push; camX = 540 * (1 - push); camY = 1200 * (1 - push);
    set($("pPay"), { transform: `translate(${P.x}px, ${P.y + 1099 * P.s * (1 - breathe)}px) scale(${P.s}, ${P.s * breathe})` });
    const [rx, ry] = at(P, 984, 417);
    set($("glow"), { display: "block", opacity: 0.95, left: `${rx - 420}px`, top: `${ry - 420}px`, width: "840px", height: "840px" });
    const [dx, dy] = at(P, 1032, 411);
    const blink = ((t - C.toPay) % 1) < 0.6 ? 1 : 0.15;
    set($("recGlow"), { opacity: blink, left: `${dx - 40}px`, top: `${dy - 40}px`, width: "80px", height: "80px" });
    const [fx, fy] = at(P, 515, 1095);
    set($("shadow"), { display: "block", left: `${fx - 300}px`, top: `${fy - 24}px`, width: "600px", height: "48px" });
    set($("pHook"), { display: "none" });
  }
  set($("room"), { transform: `translate(${camX}px, ${camY}px) scale(${camS})`, transformOrigin: "0 0" });
  // The room is scaled as one camera; keep it clipped to the frame by the body overflow.

  // Iris: the ring light opens on the payoff shot
  const ir = ease(prog(t, C.toPay, 0.55));
  if (payOn && ir < 1) {
    const [rx, ry] = at(POSE.pay, 984, 417);
    const r = lerp(0, 2300, ir);
    set($("room"), { clipPath: `circle(${r}px at ${rx}px ${ry}px)` });
    $("irisRing").setAttribute("cx", rx); $("irisRing").setAttribute("cy", ry); $("irisRing").setAttribute("r", Math.max(0, r - 20));
    set($("iris"), { display: "block", opacity: 1 - ir });
  } else {
    set($("room"), { clipPath: "none" }); set($("iris"), { display: "none" });
  }

  // ── Demo: the light-theme phone is the subject, he stands small in the corner
  const phoneOn = t >= C.cardsIn && t < C.toPay + 0.6;
  // while Elena's follow-up arrives, she takes the corner (at her café table); otherwise the broker
  const eIn = out(prog(t, C.noteIn - 0.1, 0.45)) * (1 - out(prog(t, C.elenaOut, 0.45)));
  if (phoneOn && t < C.toPay) {
    const s = 760 / 1088, x = 112 - 695.5 * s, y = 2110 - 1112 * s + (1 - out(prog(t, C.cardsIn, 0.8))) * 500;
    set($("pCorner"), { display: eIn < 1 ? "block" : "none", opacity: 1 - eIn,
      transform: `translate(${x}px, ${y + 1112 * s * (1 - breathe) + eIn * 120}px) scale(${s}, ${s * breathe})` });
    const se = 600 / 1098, xe = 150 - 678 * se, ye = 1930 - 1116 * se;
    set($("pElena"), { display: eIn > 0 ? "block" : "none", opacity: eIn,
      transform: `translate(${xe}px, ${ye + (1 - eIn) * 120 + 1116 * se * (1 - breathe)}px) scale(${se}, ${se * breathe})` });
  } else { set($("pCorner"), { display: "none" }); set($("pElena"), { display: "none" }); }

  // ── App layer: recorded film-mode clips (lib/app-phone.js)
  set($("appLayer"), { display: inApp || inEnd || phoneOn ? "block" : "none", ...(phoneOn && !inEnd ? { background: "transparent", zIndex: 20, opacity: 1 } : {}) });
  if (!(phoneOn && !inEnd)) set($("appLayer"), { background: inEnd ? "#0B0C0D" : `rgba(11,12,13,${clamp((t - C.zoom - 0.15) / 0.35)})`, zIndex: inEnd ? 40 : 20, opacity: inEnd ? out(prog(t, C.endCard, 0.5)) : 1 });
  set($("topband"), { opacity: (inApp && !inEnd && t > C.zoom + 0.4) || (phoneOn && t < C.toPay) ? 1 : 0,
    background: phoneOn ? "linear-gradient(to bottom, #EDE5D7 0%, rgba(237,229,215,.94) 62%, rgba(237,229,215,0) 100%)" : "" });
  set($("room"), { display: (t < C.zoom + 0.6 || t >= C.toPay) && !(t >= C.endCard + 0.4) ? "block" : "none", zIndex: t >= C.toPay ? 30 : 10 });
  if (!PH) PH = AppPhone.create($("appStage"), { light: true });
  let pending = null;
  if (inApp || inEnd || phoneOn) {
    let cam = null;
    if (!inEnd && !phoneOn && t < C.zoom + 0.65) {
      // match-cut: ride the room zoom out of his drawn phone, then settle into the first beat's framing
      const P = POSE.int, [ppx, ppy] = at(P, 855, 564);
      const s = lerp(1, 1.04, prog(t, C.cutInt, 3)) * lerp(1, 7, ease(prog(t, C.zoom, 0.55)));
      const hand = { sx: 589, sy: 1278, z: 0.124 * s, cx: ppx, cy: ppy, rot: 21 };
      cam = mixCam(hand, AppPhone.camAt(TL.app.beats[0], t), ease(prog(t, C.zoom + 0.18, 0.47)));
    }
    const rise = phoneOn && !inEnd ? (1 - ease(prog(t, C.cardsIn, 0.8))) * 1700 : 0;
    pending = AppPhone.render(PH, TL.app.beats, TL.clips, t, cam ? { cam } : { dy: rise, push: phoneOn ? 0.6 : 0.28 });
    set(PH.phone, { opacity: !inEnd && !phoneOn && t < C.zoom + 0.08 ? 0 : 1 });
  }
  set($("label"), { opacity: 0 });

  // ── End card
  const e = out(prog(t, C.endCard, 0.5));
  set($("endcard"), { display: inEnd ? "block" : "none", opacity: e, zIndex: 45 });
  set($("wordmark"), { opacity: out(prog(t, C.endCard + 0.15, 0.4)), transform: `translateX(-50%) translateY(${(1 - out(prog(t, C.endCard + 0.15, 0.4))) * 30}px)` });
  set($("endline"), { opacity: out(prog(t, C.endCard + 0.35, 0.4)), transform: `translateY(${(1 - out(prog(t, C.endCard + 0.35, 0.4))) * 30}px)` });
  const ctaU = out(prog(t, C.endCard + 1.6, 0.4));
  set($("cta"), { opacity: ctaU, transform: `translateX(-50%) scale(${lerp(0.92, 1, ctaU)})` });
  const fadeOut = prog(t, TL.end - 0.5, 0.5);
  document.body.style.filter = fadeOut > 0 ? `brightness(${1 - fadeOut})` : "none";

  // ── Captions
  let cap = null;
  for (const c of TL.captions) if (t >= c.a && t < c.b) cap = c;
  const ce = $("caption");
  if (cap && !inEnd) {
    $("capText").innerHTML = cap.html;
    const u = out(prog(t, cap.a, 0.16));
    set(ce, { opacity: u, transform: `translateY(${(1 - u) * 18}px) scale(${lerp(0.96, 1, u)})` });
  } else set(ce, { opacity: 0 });
  return pending;
}

window.setTime = t => render(t);
window.ready = new Promise(r => setTimeout(r, 0)).then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})).concat(document.fonts.ready)));
if (!navigator.webdriver) {
  // Plain preview in a browser: loop it
  const t0 = performance.now();
  const tick = () => { render(((performance.now() - t0) / 1000) % TL.end); requestAnimationFrame(tick); };
  window.ready.then(tick);
}
</script>
</body>
</html>
